plugins:
  - rubocop-spellcheck
  - rubocop-rake
  - rubocop-rspec

inherit_mode:
  merge:
    - Exclude

Spellcheck:
  DictionaryFiles:
    en:
      - gem:rubocop-spellcheck/data/en/en.dic
      - .spellcheck.txt

Spellcheck/Spelling:
  Ruby:
    Strings: false
    Identifiers: false

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - spec/fixtures/autocorrect/**/*
    - spec/fixtures/ruby_spelling/**/*
    - spec/fixtures/markdown_ruby/**/*
    - spec/fixtures/auto_gen_config/**/*

Naming/FileName:
  Exclude:
    - lib/rubocop-spellcheck.rb

Metrics/BlockLength:
  Enabled: false

RSpec/ExampleLength:
  Max: 12
  Exclude:
    - spec/integration_spec.rb

RSpec/MultipleExpectations:
  Max: 3
  Exclude:
    - spec/integration_spec.rb

RSpec/DescribeClass:
  Exclude:
    - spec/integration_spec.rb

Style/Documentation:
  Exclude:
    - lib/rubocop/spellcheck/version.rb
    - spec/**/*.rb
