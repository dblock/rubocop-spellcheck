plugins:
  - rubocop-spellcheck
  - rubocop-rake
  - rubocop-rspec

Spellcheck:
  DictionaryFiles:
    en:
      - gem:rubocop-spellcheck/data/en/en.dic
      - .spellcheck.txt

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable

Naming/FileName:
  Exclude:
    - lib/rubocop-spellcheck.rb

Metrics/BlockLength:
  Enabled: false

RSpec/ExampleLength:
  Max: 12
  Exclude:
    - spec/integration_spec.rb

RSpec/MultipleExpectations:
  Max: 3
  Exclude:
    - spec/integration_spec.rb

RSpec/DescribeClass:
  Exclude:
    - spec/integration_spec.rb

Style/Documentation:
  Exclude:
    - lib/rubocop/spellcheck/version.rb
    - spec/**/*.rb
