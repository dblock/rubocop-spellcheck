plugins:
  - rubocop-spellcheck

Spellcheck:
  DictionaryFiles:
    en:
      - gem:rubocop-spellcheck/data/en/en.dic
      - .spellcheck.txt

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable

Naming/FileName:
  Exclude:
    - lib/rubocop-spellcheck.rb

Metrics/BlockLength:
  Exclude:
    - spec/**/*.rb
    - "*.gemspec"

Style/Documentation:
  Exclude:
    - lib/rubocop/spellcheck/version.rb
    - spec/**/*.rb
