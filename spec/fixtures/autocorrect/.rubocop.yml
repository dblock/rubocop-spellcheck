plugins:
  - rubocop-spellcheck

AllCops:
  NewCops: enable
  SuggestExtensions: false

Spellcheck:
  DictionaryFiles:
    en:
      - en.dic
      - words.txt

Spellcheck/Spelling:
  Markdown:
    FrontMatter:
      Include:
        - title
        - caption
        - quoted
        - summary
        - metadata
      Exclude:
        - metadata.slug
