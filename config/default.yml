Spellcheck:
  # Null selects the packaged English dictionary; an explicit map replaces it.
  DictionaryFiles:

AllCops:
  Include:
    - "**/*.md"
    - "**/*.markdown"
    - "**/*.txt"
    - "**/*.rdoc"
    - "**/*.adoc"
    - "**/*.asciidoc"

Spellcheck/Spelling:
  Description: Check spelling in Ruby comments, Markdown prose, and plain text.
  Enabled: true
  SafeAutoCorrect: false
  Markdown:
    FrontMatter:
      Enabled: true
      Include:
      Exclude: []
  VersionAdded: "0.1"
  VersionChanged: "0.2"
