name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / RuboCop ${{ matrix.rubocop }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '4.0']
        rubocop: ['~> 1.72']
        include:
          - ruby: '3.2'
            rubocop: '1.72.1'
    env:
      RUBOCOP_VERSION: ${{ matrix.rubocop }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      - uses: actions/upload-artifact@v4
        if: matrix.ruby == '4.0'
        with:
          name: coverage
          path: coverage/
